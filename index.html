<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101815">
  <title>Audio2Tube</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="stylesheet" href="style.css">
  <script defer src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <script defer src="counter.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <main>
    <header>
      <h1><img src="favicon.png" width="36" height="36" alt="">Audio<span>2Tube</span></h1>
      <p>Turn audio into a video for YouTube. Your files stay on this device.</p>
    </header>
    <section class="panel" aria-label="Video converter">
      <div class="file-inputs">
        <label class="file-label">
          <span class="symbol" aria-hidden="true">♫</span>
          <span class="details"><strong id="audio-label-text">Choose audio</strong><small>MP3, M4A, AAC or WAV</small></span>
          <input type="file" id="audio" accept="audio/*">
        </label>
        <label class="file-label">
          <span class="symbol cover-symbol" aria-hidden="true">▧<img id="cover-preview" alt="" hidden></span>
          <span class="details"><strong id="image-label-text">Choose cover (optional)</strong><small>JPG, PNG or WebP</small></span>
          <input type="file" id="image" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp">
        </label>
      </div>
      <div class="hint-row"><small>Or drag and drop your files here.</small><button type="button" id="clear-cover" hidden>Remove cover</button></div>
      <div class="actions">
        <label class="resolution" for="resolution">Video resolution
          <select id="resolution"><option value="1280">720p</option><option value="1920">1080p</option></select>
        </label>
        <button id="convert">Convert to MP4 <span aria-hidden="true">→</span></button>
      </div>
      <div id="progress-box"><div id="progress-bar"></div></div>
      <div id="status" role="status"></div>
      <button id="cancelBtn">Cancel conversion</button>
      <button id="saveBtn">Save video</button>
    </section>
    <footer><p id="conversion-total" hidden><span id="conversion-count"></span> videos converted <small id="count-sync" role="status"></small></p></footer>
  </main>
  <div id="drop-overlay">Drop your files here</div>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
