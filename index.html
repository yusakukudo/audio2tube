<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8" />
  <title>Audio2Tube</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Cross-origin isolation (required for ffmpeg.wasm threads) -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">

  <!-- FFmpeg WASM -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
</head>
<body>
  <div class="container">

    <h1>Audio<span>2Tube</span> </h1>
    <p class="subtitle">
      Turn an audio track and cover image into a YouTube-ready video.
    </p>

    <div class="upload-card">
      <p class="drag-hint">Choose your files or drop them anywhere on this page.</p>
      <div class="file-inputs">
        <label class="file-label">
          <span class="file-icon" aria-hidden="true">♫</span>
          <strong id="audio-label-text">Choose audio</strong>
          <small>MP3, M4A, AAC or WAV</small>
          <input type="file" id="audio" accept="audio/*" />
        </label>
        <label class="file-label">
          <span class="file-icon" aria-hidden="true">▧</span>
          <strong id="image-label-text">Choose cover (optional)</strong>
          <small>JPG, PNG or WebP</small>
          <input type="file" id="image" accept="image/*" />
        </label>
      </div>
      <img id="cover-preview" alt="Selected cover" hidden />
      <div class="quality-row">
        <label for="resolution">Video resolution</label>
        <select id="resolution">
          <option value="1280">720p (Fastest)</option>
          <option value="1920">1080p (Balanced)</option>
        </select>
      </div>
      <button id="convert">Convert to MP4</button>
      <button id="cancelBtn" class="cancel-btn">
        ⛔ Cancel
      </button>

      <div id="progress-box" style="display:none;">
        <div id="progress-bar"></div>
      </div>

      <div id="status" role="status"></div>

    </div>

    <!-- OUTPUT SECTION -->
    <div id="output">

      <video id="preview" controls style="display:none;"></video>

      <!-- New Save Button -->
      <button id="saveBtn" class="download-btn" style="display:none;">
        💾 Save Video
      </button>

    </div>

    <footer>
      <!-- <button id="contribute">💖 Contribute</button> -->
      <p id="conversion-total" hidden>🎬 <span id="conversion-count"></span> videos converted</p>
      <p>Made with ❤️</p>
    </footer>

  </div>

  <!-- Load your script LAST -->
  <script src="script.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>

  <div id="drop-overlay">📂 Drop files anywhere</div>
</body>
</html>
